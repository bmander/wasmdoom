name: Build, test, and deploy DOOM

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Check out the pinned Emscripten SDK
        uses: actions/checkout@v6
        with:
          repository: emscripten-core/emsdk
          ref: 6.0.7
          path: .cache/emsdk
          persist-credentials: false
      - name: Install Emscripten
        run: |
          .cache/emsdk/emsdk install 6.0.7
          .cache/emsdk/emsdk activate 6.0.7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Compile WebAssembly and package corresponding source
        run: |
          source .cache/emsdk/emsdk_env.sh
          npm run build
      - name: Test enemy behavior in the native engine
        run: npm run test:ai
      - name: Verify the offline self-play arena
        run: npm run test:training
      - name: Install browser for integration tests
        run: npx playwright install --with-deps chromium
      - name: Test the compiled game in a browser
        run: xvfb-run --auto-servernum --server-args="-screen 0 1920x1440x24" npm test
      - name: Upload site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
